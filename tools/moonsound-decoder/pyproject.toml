[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonsound"
version = "1.0.0"
description = "Python tools for parsing and analyzing MoonSound/OPL4 audio files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "ZXM-MoonSound Project" }
]
keywords = [
    "moonsound",
    "opl4",
    "ymf278b",
    "moonblaster",
    "zx-spectrum",
    "msx",
    "audio",
    "music",
    "fm-synthesis",
    "wavetable"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
moonsound = "src.cli:main"

[project.urls]
Homepage = "https://github.com/alfishe/zxm-moonsound"
Repository = "https://github.com/alfishe/zxm-moonsound"
Documentation = "https://github.com/alfishe/zxm-moonsound/tree/master/tools/moonsound-decoder"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
